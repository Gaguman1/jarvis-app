<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      /* Ignore mouse events in the document */
      pointer-events: none;
    }
    
    .screen-border {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      box-sizing: border-box;
      border: 4px solid #0ea5e9;
      box-shadow: inset 0 0 30px rgba(14, 165, 233, 0.8), 0 0 30px rgba(14, 165, 233, 0.8);
      animation: pulseBorder 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseBorder {
      0% {
        box-shadow: inset 0 0 20px rgba(14, 165, 233, 0.5), 0 0 20px rgba(14, 165, 233, 0.5);
      }
      50% {
        box-shadow: inset 0 0 40px rgba(14, 165, 233, 1), 0 0 40px rgba(14, 165, 233, 1);
      }
      100% {
        box-shadow: inset 0 0 20px rgba(14, 165, 233, 0.5), 0 0 20px rgba(14, 165, 233, 0.5);
      }
    }
  </style>
</head>
<body>
  <div class="screen-border"></div>
</body>
</html>
